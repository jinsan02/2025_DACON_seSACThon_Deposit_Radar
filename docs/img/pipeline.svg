<text x="0" y="280" font-size="13" class="lbl">RAG(검색 증강 생성)는 구현하지 않았다 — 해커톤 멘토의 다음 단계 피드백이다. 모델은 gpt-4o-mini 하나만 호출한다.</text>
<text x="0" y="302" font-size="13" class="muted">경량·고성능 모델 분리는 계획 단계에 그쳤다.</text>
