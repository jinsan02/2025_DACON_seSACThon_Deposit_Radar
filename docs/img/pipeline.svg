<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 1024 402" width="1024" height="402" role="img" aria-label="분석 결과 JSON을 요약 텍스트로 바꾸고, 규칙으로 RED/AMBER/GREEN 등급을 정한 뒤 등급별 고정 경고 지침을 넣어 gpt-4o-mini가 요약·체크리스트·Q&amp;A를 JSON으로만 쓴다. Jinja2 템플릿과 WeasyPrint로 등급 색 테마의 PDF를 만든다">
<title>리포트 생성 파이프라인 — 등급과 핵심 경고는 규칙이, 서술은 LLM이</title>
<style>
