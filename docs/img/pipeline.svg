<text x="0" y="24" font-size="18" font-weight="600" class="ink">리포트 생성 파이프라인 — 등급과 핵심 경고는 규칙이, 서술은 LLM이</text><text x="0" y="48" font-size="14" class="sub">법률 정보가 틀리면 임차인이 손해를 보므로 등급·경고를 LLM 밖에 둔 의도된 설계 · 파란 상자 = 규칙·고정 문안</text>
